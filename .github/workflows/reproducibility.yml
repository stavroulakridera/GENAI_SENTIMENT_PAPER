name: Reproducibility smoke tests

on:
  pull_request:
  push:
    branches:
      - audit/frontiers-reproducibility-20261118

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0" "pandas>=2.0" "scikit-learn>=1.5"

      - name: Compile all Python files
        run: python -m compileall -q src tests

      - name: Test group-disjoint split and metric schemas
        run: python -m unittest discover -s tests -v

      - name: Verify saved data partitions and outputs
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          train = pd.read_csv("data/group_disjoint/group_train.csv")
          test = pd.read_csv("data/group_disjoint/group_test.csv")
          assert len(train) == 61760
          assert len(test) == 6865
          assert not set(train["Tweet_ID"]) & set(test["Tweet_ID"])
          assert not set(train["Tweet"].astype(str)) & set(test["Tweet"].astype(str))
          assert Path("data/raw/twitter_training.csv").stat().st_size > 10_000_000
          print("Group-disjoint partition and raw inputs: PASS")
          PY

      - name: Recalculate all available saved predictions
        run: python src/evaluation/recompute_class_metrics.py

      - name: Check published benchmark values
        run: |
          python - <<'PY'
          import pandas as pd
          derived = pd.read_csv("results/derived/overall_metrics.csv")
          tables = "results/tables/"
          for model, stem in [("DNN", "dnn"), ("CNN", "cnn"), ("BERT", "bert")]:
              computed = derived[
                  (derived["Model"] == model) &
                  (derived["Protocol"] == "standard") &
                  (derived["Condition"] == "Entity+Tweet")
              ]["Macro_F1"].mean()
              summary = pd.read_csv(tables + stem + "_entity_5seeds_summary.csv")
              reported = float(summary.loc[summary["Metric"] == "Macro F1", "Mean"].iloc[0])
              assert abs(computed - reported) < 1e-10, (model, computed, reported)
          qwen = derived[
              (derived["Model"] == "Qwen2.5 3B / Few-shot") &
              (derived["Protocol"] == "standard")
          ]["Macro_F1"].iloc[0]
          reported = pd.read_csv(tables + "qwen_few_shot_results.csv")["Macro F1"].iloc[0]
          assert abs(qwen - reported) < 1e-10, (qwen, reported)
          print("DNN/CNN/BERT/Qwen metrics: PASS")
          PY
