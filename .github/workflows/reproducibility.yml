name: Research-code smoke tests

on:
  pull_request:
  push:
    branches: [main, audit/frontiers-reproducibility-20261118]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install lightweight testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0" "pandas>=2.0" "scikit-learn>=1.5" "requests>=2.0"
      - name: Compile Python scripts
        run: python -m compileall -q src tests
      - name: Test group splits and derived-metric logic
        run: python -m unittest discover -s tests -v
      - name: Verify frozen input data
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          assert Path('data/raw/twitter_training.csv').stat().st_size > 10_000_000
          tr = pd.read_csv('data/group_disjoint/group_train.csv')
          te = pd.read_csv('data/group_disjoint/group_test.csv')
          assert len(tr) == 61760 and len(te) == 6865
          assert not set(tr['Tweet_ID']) & set(te['Tweet_ID'])
          assert not set(tr['Tweet'].astype(str)) & set(te['Tweet'].astype(str))
          print('Frozen datasets: PASS')
          PY
      - name: Check generated outputs are untracked
        run: |
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', 'results/'], text=True).splitlines()
          assert not [p for p in paths if p != 'results/.gitkeep'], paths
          print('No generated outputs tracked: PASS')
          PY
